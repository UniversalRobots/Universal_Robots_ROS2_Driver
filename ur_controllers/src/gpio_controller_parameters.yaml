gpio_controller:
   tf_prefix: {
    type: string,
    default_value: "",
    description: "Urdf prefix of the corresponding arm"
   }
   check_io_successfull_retries: {
      type: int,
      default_value: 10,
      description: "Amount of retries for checking if the selected gpio was set successfully"
   }
   tool_t2_interfaces: {
      type: bool,
      default_value: false,
      read_only: true,
      description: "Claim the connector T2 command and state interfaces (tool_voltage_t2_cmd, tool_t2_available, tool_output_voltage_2, tool_output_current_2). The real driver exports these even when the description omits them. Mock and simulation hardware only export what the description lists, so leave this false for a description that does not declare them."
   }
   verify_payload_on_set: {
      type: bool,
      default_value: true,
      description: "Whether to check if the payload of the set command is correct. If false, the controller will only check if the command was successful, but not if the correct value was set. Setting this to false can be useful if the controller is used on a robot with mock hardware or GZ simulation."
   }
